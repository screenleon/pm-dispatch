      - uses: actions/checkout@v6
      - name: gate-protocol regression suite
        run: bash tests/shell/test-gate-protocol.sh

  test-pmctl-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl gate run regression suite
        run: bash tests/shell/test-pmctl-gate.sh

  test-gate-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: gate detached lifecycle regression suite
        run: bash tests/shell/test-gate-lifecycle.sh

  test-pmctl-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl task lifecycle regression suite
        run: bash tests/shell/test-pmctl-task.sh

  test-pmctl-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl safe bash regression suite
        run: bash tests/shell/test-pmctl-safe.sh

  test-pmctl-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl validate brief regression suite
        run: bash tests/shell/test-pmctl-validate.sh

  test-pmctl-worktree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl worktree regression suite
        run: bash tests/shell/test-pmctl-worktree.sh

  test-pmctl-ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl ship regression suite
        run: bash tests/shell/test-pmctl-ship.sh

  lint-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate BACKLOG.md
        run: |
          set +e
          error_output=$(bash pm/scripts/validate.sh BACKLOG.md 2>&1)
          rc=$?
          set -e
          error_count=$(printf '%s\n' "${error_output}" | grep -c '^E-' || true)
          printf '%s\n' "${error_output}"
          printf 'BACKLOG validation errors: %d\n' "${error_count}"
          exit "${rc}"

  lint-ticket-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert no ticket id collides across active board and archive
        run: |
          set +e
          error_output=$(bash pm/scripts/lint-ticket-ids.sh BACKLOG.md BACKLOG-ARCHIVE.md 2>&1)
          rc=$?
          set -e
          error_count=$(printf '%s\n' "${error_output}" | grep -c '^E-' || true)
          printf '%s\n' "${error_output}"
          printf 'Ticket id collisions: %d\n' "${error_count}"
          exit "${rc}"
