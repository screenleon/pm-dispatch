  test-codex-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: codex-dispatch regression suite
        run: ./tests/shell/test-codex-dispatch.sh

  test-claude-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: claude-dispatch adapter regression suite
        run: ./tests/shell/test-claude-dispatch.sh

  test-grok-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: grok-dispatch adapter regression suite
        run: ./tests/shell/test-grok-dispatch.sh

  test-layer-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: layer-boundary enforcer
        run: ./tests/shell/test-layer-boundaries.sh

  test-dispatch-handover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: dispatch handover regression suite
        run: ./tests/shell/test-dispatch-handover.sh

  test-handover-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: handover validator regression suite
        run: bash tests/shell/test-handover-validate.sh

  test-lint-model-aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: model-alias linter regression suite
        run: bash tests/shell/test-lint-model-aliases.sh

  test-model-aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: model aliases unit suite
        run: bash tests/shell/test-model-aliases.sh

  test-core-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: core schema structural tests
        run: bash tests/shell/test-core-schemas.sh

  test-pm-prep-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git fetch --depth=1 origin main
      - name: pm-prep-snapshot regression suite
        run: bash tests/shell/test-pm-prep-snapshot.sh

  test-check-docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: check-docs-freshness regression suite
        run: bash tests/shell/test-check-docs-freshness.sh

  lint-policy-doc-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate GENERATED policy tables against their core/policy sources
        run: bash tools/lint/check-policy-doc-sync.sh

  test-check-policy-doc-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: check-policy-doc-sync regression suite
        run: bash tests/shell/test-check-policy-doc-sync.sh

  lint-planning-status-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: MILESTONES.md status cells agree with the BACKLOG.md authority
        run: bash tools/lint/check-planning-status-consistency.sh

  test-check-planning-status-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: check-planning-status-consistency regression suite
        run: bash tests/shell/test-check-planning-status-consistency.sh

  test-lint-permanent-test-admissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: lint-permanent-test-admissions regression suite
        run: bash tests/shell/test-lint-permanent-test-admissions.sh

  lint-permanent-test-admissions:
    # PR-only: needs the PR body and the base commit. On push to main there is
    # neither, and the record was already enforced on the PR that introduced
    # the change.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enforce the Step 4 'Permanent test admissions:' record
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' > pr-body.txt
          ./tools/lint/lint-permanent-test-admissions.sh --pr-body pr-body.txt --base "$BASE_SHA"

  test-schema-task-mirrors-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: schema task mirrors backlog regression suite
        run: bash tests/shell/test-schema-task-mirrors-backlog.sh

  test-state-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: state store regression suite
        run: bash tests/shell/test-state-store.sh

  test-pmctl-operation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: parent operation regression suite
        run: bash tests/shell/test-pmctl-operation.sh

  test-state-layout-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: state layout parity regression suite
        run: bash tests/shell/test-state-layout-parity.sh

  test-state-store-rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: state store rotation regression suite
        run: bash tests/shell/test-state-store-rotation.sh

  test-archive-closed-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: archive-closed-backlog regression suite
        run: bash tests/shell/test-archive-closed-backlog.sh

  test-pmctl-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl backlog regression suite
        run: bash tests/shell/test-pmctl-backlog.sh

  test-pmctl-guard:
