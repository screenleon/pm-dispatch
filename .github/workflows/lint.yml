name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate agent frontmatter
        run: ./scripts/lint-agents.sh

  lint-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Grammar coverage for the restricted subset is provided by test-lint-frontmatter below.
      - name: Validate frontmatter (restricted YAML subset)
        run: ./scripts/lint-frontmatter.sh

  test-lint-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: lint-frontmatter regression suite
        run: bash scripts/test-lint-frontmatter.sh

  test-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Command contract tests
        run: ./scripts/test-commands.sh
      - name: Command runner CLI tests
        run: ./scripts/test-commands-runner.sh

  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate script hygiene
        run: ./scripts/lint-scripts.sh
      - name: Validate codex model alias source-of-truth
        run: bash scripts/lint-model-aliases.sh

  test-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Hook regression suite
        run: ./scripts/test-hooks.sh

  test-hook-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Hook framework regression suite
        run: ./scripts/test-hook-framework.sh

  test-pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pr-gate regression suite
        run: ./scripts/test-pr-gate.sh

  test-executor-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: executor router regression suite
        run: bash scripts/test-executor-router.sh

  test-pmctl-adapter-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl adapter generate regression suite
        run: bash scripts/test-pmctl-adapter-generate.sh

  test-skill-refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: skill-refine regression suite
        run: bash scripts/test-skill-refine.sh
      - name: skill-refine shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # tag 2.0.0
        with:
          scandir: ./scripts
          ignore_names: >-
            executor-router.sh
            gate-result-verify.sh
            pmctl-adapter.sh
            pmctl-backlog.sh
            pmctl-fs.sh
            pmctl-policy.sh
            handover-validate.sh
            codex-dispatch.sh
            codex-watch.sh
            hook-codex-bash-guard.sh
            hook-codex-write-guard.sh
            hook-claude-write-guard.sh
            hook-inject-memory.sh
            hook-log-claude-usage.sh
            hook-pm-write-guard.sh
            hook-reviewer-write-guard.sh
            hook-routing-log.sh
            hook-save-rate-limits.sh
            hook-session-summary.sh
            hook-tool-trace.sh
            install-hooks.sh
            lint-agents.sh
            lint-scripts.sh
            log-usage.sh
            migrate-routing-log.sh
            patch-gitignore.sh
            pr-gate.sh
            setup-project.sh
            state-writer.sh
            test-check-docs-freshness.sh
            test-codex-dispatch.sh
            test-pmctl-dispatch.sh
            test-claude-dispatch.sh
            test-layer-boundaries.sh
            test-core-schemas.sh
            test-commands.sh
            test-commands-runner.sh
            test-dispatch-handover.sh
            test-executor-router.sh
            test-runner-kind.sh
            test-pmctl-adapter-generate.sh
            test-pmctl-backlog.sh
            test-pmctl-guard.sh
            test-handover-validate.sh
            hook-framework.sh
            test-hook-framework.sh
            test-hooks.sh
            test-install.sh
            test-lint-frontmatter.sh
            test-migrate-routing-log.sh
            test-patch-gitignore.sh
            test-pr-gate.sh
            test-pr-gate-profile.sh
            test-portable.sh
            test-claude-executor.sh
            test-pm-prep-snapshot.sh
            test-setup-project.sh
            test-skill-refine.sh
            test-state-store.sh
            test-state-layout-parity.sh
            test-state-store-rotation.sh
            test-uninstall.sh
            test-usage-tracker.sh
            test-usage-weekly.sh
            token-usage.sh
            uninstall-hooks.sh
            usage-weekly.sh
            memory.sh
            memory-dir.sh
            doctor.sh
            test-doctor.sh
            test-e2e.sh
            test-harness.sh
            test-test-harness.sh
            test-lint-model-aliases.sh
            test-schema-task-mirrors-backlog.sh
            test-brief-validate.sh
            dispatch-post-verify.sh
            test-dispatch-post-verify.sh
            archive-closed-backlog.sh
            test-archive-closed-backlog.sh
            migrate-routing-to-events.sh
            test-migrate-routing-to-events.sh
            test-pmctl-trace.sh
            test-pmctl-gate.sh
            pmctl-gate.sh
            pmctl-task.sh
            pmctl-safe.sh
            pmctl-validate.sh
            pmctl-decision.sh
            test-pmctl-task.sh
            test-pmctl-safe.sh
            test-pmctl-validate.sh
            test-pmctl-decision.sh

  test-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: doctor.sh regression suite
        run: ./scripts/test-doctor.sh

  test-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: portable helper regression suite
        run: ./scripts/test-portable.sh

  test-brief-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: brief validator regression suite
        run: bash scripts/test-brief-validate.sh

  test-dispatch-post-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: dispatch post-verify regression suite
        run: bash scripts/test-dispatch-post-verify.sh

  test-pr-gate-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pr-gate executor split regression suite
        run: ./scripts/test-pr-gate-profile.sh

  test-setup-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: setup-project regression suite
        run: ./scripts/test-setup-project.sh

  test-install-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install/uninstall core regression suite
        run: CLAUDE_CONFIG_TEST_PREFLIGHT_HOME="$HOME" ./scripts/test-install.sh --group core

  test-install-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install/uninstall hooks regression suite
        run: CLAUDE_CONFIG_TEST_PREFLIGHT_HOME="$HOME" ./scripts/test-install.sh --group hooks

  test-usage-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: usage-weekly regression suite
        run: ./scripts/test-usage-weekly.sh

  test-codex-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: codex-dispatch regression suite
        run: ./scripts/test-codex-dispatch.sh

  test-claude-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: claude-dispatch adapter regression suite
        run: ./scripts/test-claude-dispatch.sh

  test-layer-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: layer-boundary enforcer
        run: ./scripts/test-layer-boundaries.sh

  test-dispatch-handover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: dispatch handover regression suite
        run: ./scripts/test-dispatch-handover.sh

  test-handover-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: handover validator regression suite
        run: bash scripts/test-handover-validate.sh

  test-lint-model-aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: model-alias linter regression suite
        run: bash scripts/test-lint-model-aliases.sh

  test-core-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: core schema structural tests
        run: bash scripts/test-core-schemas.sh

  test-pm-prep-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git fetch --depth=1 origin main
      - name: pm-prep-snapshot regression suite
        run: bash scripts/test-pm-prep-snapshot.sh

  test-check-docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: check-docs-freshness regression suite
        run: bash scripts/test-check-docs-freshness.sh

  test-schema-task-mirrors-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: schema task mirrors backlog regression suite
        run: bash scripts/test-schema-task-mirrors-backlog.sh

  test-state-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: state store regression suite
        run: bash scripts/test-state-store.sh

  test-state-layout-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: state layout parity regression suite
        run: bash scripts/test-state-layout-parity.sh

  test-state-store-rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: state store rotation regression suite
        run: bash scripts/test-state-store-rotation.sh

  test-archive-closed-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: archive-closed-backlog regression suite
        run: bash scripts/test-archive-closed-backlog.sh

  test-pmctl-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl backlog regression suite
        run: bash scripts/test-pmctl-backlog.sh

  test-pmctl-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl guard check regression suite
        run: bash scripts/test-pmctl-guard.sh

  test-pmctl-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl trace tail regression suite
        run: bash scripts/test-pmctl-trace.sh

  test-pmctl-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl gate run regression suite
        run: bash scripts/test-pmctl-gate.sh

  test-pmctl-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl task lifecycle regression suite
        run: bash scripts/test-pmctl-task.sh

  test-pmctl-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl safe bash regression suite
        run: bash scripts/test-pmctl-safe.sh

  test-pmctl-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl validate brief regression suite
        run: bash scripts/test-pmctl-validate.sh

  lint-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate BACKLOG.md
        run: |
          set +e
          error_output=$(bash pm/scripts/validate.sh BACKLOG.md 2>&1)
          rc=$?
          set -e
          error_count=$(printf '%s\n' "${error_output}" | grep -c '^E-' || true)
          printf '%s\n' "${error_output}"
          printf 'BACKLOG validation errors: %d\n' "${error_count}"
          exit "${rc}"

  lint-ticket-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert no ticket id collides across active board and archive
        run: |
          set +e
          error_output=$(bash pm/scripts/lint-ticket-ids.sh BACKLOG.md BACKLOG-ARCHIVE.md 2>&1)
          rc=$?
          set -e
          error_count=$(printf '%s\n' "${error_output}" | grep -c '^E-' || true)
          printf '%s\n' "${error_output}"
          printf 'Ticket id collisions: %d\n' "${error_count}"
          exit "${rc}"
