name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate agent frontmatter
        run: ./tools/lint/lint-agents.sh

  lint-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Grammar coverage for the restricted subset is provided by test-lint-frontmatter below.
      - name: Validate frontmatter (restricted YAML subset)
        run: ./tools/lint/lint-frontmatter.sh

  test-lint-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: lint-frontmatter regression suite
        run: bash tests/shell/test-lint-frontmatter.sh

  test-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Command contract tests
        run: ./tests/shell/test-commands.sh
      - name: Command runner CLI tests
        run: ./tests/shell/test-commands-runner.sh

  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate script hygiene
        run: ./tools/lint/lint-scripts.sh --hygiene-only
      - name: Validate codex model alias source-of-truth
        run: bash tools/lint/lint-model-aliases.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install repository-pinned ShellCheck
        run: |
          shellcheck_bin_dir="$(bash tools/lint/bootstrap-shellcheck.sh --cache-dir "$RUNNER_TEMP/pm-dispatch-tools")"
          printf '%s\n' "$shellcheck_bin_dir" >> "$GITHUB_PATH"
      - name: Report ShellCheck version
        run: shellcheck --version
      - name: Validate canonical shell domains and compatibility shims
        run: ./tools/lint/lint-shellcheck.sh
      - name: ShellCheck domain and ratchet regression suite
        run: ./tests/shell/test-lint-shellcheck.sh

  lint-script-domain-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate migration inventory and canonical references
        run: bash tools/lint/lint-script-domain-inventory.sh
      - name: Script-domain inventory regression suite
        run: bash tests/shell/test-script-domain-inventory.sh

  lint-portable-repo-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject maintainer-local repository paths
        run: bash tools/lint/lint-portable-repo-paths.sh
      - name: Repository-path portability regression suite
        run: bash tests/shell/test-lint-portable-repo-paths.sh

  lint-pmctl-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate pmctl command discovery parity
        run: ./tools/lint/lint-pmctl-commands.sh
      - name: pmctl discovery regression suite
        run: ./tests/shell/test-pmctl-discovery.sh

  lint-test-docstrings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate test docstring convention (allowlisted files)
        run: ./tools/lint/lint-test-docstrings.sh

  test-lint-test-docstrings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: lint-test-docstrings regression suite
        run: bash tests/shell/test-lint-test-docstrings.sh

  test-suite-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate full-runner and CI suite coverage parity
        run: bash tools/lint/lint-test-suite-registry.sh
      - name: Suite coverage registry regression suite
        run: bash tests/shell/test-lint-test-suite-registry.sh
      - name: Validate command, agent, and skill coverage declarations
        run: bash tools/lint/lint-surface-coverage.sh
      - name: Surface coverage declaration regression suite
        run: bash tests/shell/test-lint-surface-coverage.sh
      - name: Runtime library direct regression suite
        run: bash tests/shell/test-runtime-lib-coverage.sh

  test-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Guard regression suite
        env:
          TEST_GUARDS_PROGRESS: "1"
        run: ./tests/shell/test-guards.sh

  test-guard-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Guard framework regression suite
        run: ./tests/shell/test-guard-framework.sh

  test-pr-gate-shard-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pr-gate regression suite (shard 1/4)
        run: ./tests/shell/test-pr-gate-shard-1.sh

  test-pr-gate-shard-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pr-gate regression suite (shard 2/4)
        run: ./tests/shell/test-pr-gate-shard-2.sh

  test-pr-gate-shard-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pr-gate regression suite (shard 3/4)
        run: ./tests/shell/test-pr-gate-shard-3.sh

  test-pr-gate-shard-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pr-gate regression suite (shard 4/4)
        run: ./tests/shell/test-pr-gate-shard-4.sh

  test-executor-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: executor router regression suite
        run: bash tests/shell/test-executor-router.sh

  test-pmctl-adapter-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pmctl adapter generate regression suite
        run: bash tests/shell/test-pmctl-adapter-generate.sh

  test-skill-refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: skill-refine regression suite
        run: bash tests/shell/test-skill-refine.sh

  test-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: doctor.sh regression suite
        run: ./tests/shell/test-doctor.sh

  test-host-resolver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shared host config-root resolver conformance suite
        run: bash tests/shell/test-host-resolver.sh

  test-hook-profile-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: hook-profile parity regression suite
        run: ./tests/shell/test-hook-profile-parity.sh

  test-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: portable helper regression suite
        run: ./tests/shell/test-portable.sh

  test-brief-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: brief validator regression suite
        run: bash tests/shell/test-brief-validate.sh

  test-dispatch-post-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: dispatch post-verify regression suite
        run: bash tests/shell/test-dispatch-post-verify.sh

  test-pr-gate-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pr-gate executor split regression suite
        run: ./tests/shell/test-pr-gate-profile.sh

  test-setup-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: setup-project regression suite
        run: ./tests/shell/test-setup-project.sh

  test-install-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install/uninstall core regression suite
        run: CLAUDE_CONFIG_TEST_PREFLIGHT_HOME="$HOME" ./tests/shell/test-install.sh --group core

  test-install-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install/uninstall guards regression suite
        run: CLAUDE_CONFIG_TEST_PREFLIGHT_HOME="$HOME" ./tests/shell/test-install.sh --group guards

  test-usage-weekly:
