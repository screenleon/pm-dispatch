  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install repository-pinned ShellCheck
        run: |
          shellcheck_bin_dir="$(bash tools/lint/bootstrap-shellcheck.sh --cache-dir "$RUNNER_TEMP/pm-dispatch-tools")"
          printf '%s\n' "$shellcheck_bin_dir" >> "$GITHUB_PATH"
      - name: Report ShellCheck version
        run: shellcheck --version
      - name: Validate canonical shell domains and compatibility shims
        run: ./tools/lint/lint-shellcheck.sh
      - name: ShellCheck domain and ratchet regression suite
        run: ./tests/shell/test-lint-shellcheck.sh

  lint-script-domain-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate migration inventory and canonical references
        run: bash tools/lint/lint-script-domain-inventory.sh
      - name: Script-domain inventory regression suite
        run: bash tests/shell/test-script-domain-inventory.sh

  lint-jq-lf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Every jq-calling entry loads the jq LF shim
        run: bash tools/lint/lint-jq-lf.sh
      - name: jq LF shim coverage lint regression suite
        run: bash tests/shell/test-lint-jq-lf.sh

  # CC-594: force the native Windows jq LF shim in this Linux CI leg, so a
  # change that breaks under it (a PATH stub jq that inspects its first argument
  # and now receives -b, a reader that depended on the old stdin CR handling)
  # would first show up on a Windows host. th_init turns the shim on for these
  # suites when PM_DISPATCH_TEST_FORCE_JQ_LF=1 and exports it to launched processes.
  test-jq-lf-forced:
    runs-on: ubuntu-latest
    env:
      PM_DISPATCH_TEST_FORCE_JQ_LF: "1"
    steps:
      - uses: actions/checkout@v6
      # These suites also have their own standalone jobs; running them again here is
      # intentional and not tracked by lint-test-suite-registry (it counts only the
      # `bash tests/shell/<suite>.sh` lines of the per-suite jobs). Every suite runs
      # and the failures are listed at the end, so one red suite does not hide the rest.
      - name: Suites that read, stub or digest jq output, with the jq LF shim forced on
        run: |
          failed=""
          for suite in test-jq-lf test-guard-framework test-pmctl-guard test-gate-policy \
            test-gate-structural-verify test-gate-scope-manifest-verify test-gate-digest \
            test-pmctl-trace test-pmctl-run-stats test-pmctl-gate-stats test-pmctl-artifacts; do
            echo "== $suite (shim forced on)"
            bash "tests/shell/$suite.sh" || failed="$failed $suite"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed with the jq LF shim forced on:$failed"
            exit 1
          fi

