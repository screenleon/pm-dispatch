# adapter.yaml - AUTHORED manifest for adapters/grok/.
# This file is the source of truth. Hand-authored; nothing here is regenerated:
# generated_files is empty and pmctl must not edit this file.
schema_version: 1
adapter_name: grok
executor: grok
cli_binary: grok
isolation_map_ref: ./isolation-map.yaml
runner_ref: ./dispatch.sh
dispatch_contract: dispatch_handover_v1
# runner_kind: grok runs as an independent headless subprocess driven by
# pmctl dispatch run. The brief is authored by pmctl and passed as
# --prompt-file; no executor subagent self-writes a brief, so no live
# PreToolUse write guard is needed.
runner_kind: cli-subprocess
write_guard_mode: cli-only
# Grok governs its own command execution via --permission-mode and OS-level
# --sandbox; pm-dispatch registers no executor bash policy for grok.
needs_bash_guard: false
# terminal_event: grok --output-format streaming-json emits JSONL; the
# terminal event type is "end". post-verify asserts at least one trace
# record matches it.
terminal_event: end
generated_files: []
