# adapters/opencode/isolation-map.yaml
#
# RUNTIME adapter map — hand-authored, consumed by adapters/opencode/dispatch.sh.
# Format: native_flags (flat list of CLI flags appended to `opencode run`).
#
# opencode's CLI permission model is coarse: the only CLI flag is
# --dangerously-skip-permissions (all prompts auto-approved). Fine-grained
# control (edit/bash allow/deny rules) lives in ~/.config/opencode/opencode.json
# and is the user's responsibility (auth/permission separation of concerns).
#
# Supported isolation levels (source of truth: core/policy/isolation-level.yaml):
#   none            – no isolation; full machine access
#                     → --dangerously-skip-permissions
#   workspace-write – write within project working dir (opencode default)
#                     → no extra CLI flag needed; opencode prompts on edit by default
#
# Unsupported levels (NOT listed here → dispatch.sh rejects with exit 2):
#   read-only       – opencode has no CLI flag to enforce read-only access;
#                     requires host-level opencode.json configuration outside
#                     pm-dispatch control. Use workspace-write + host config.
#   workspace-network – network access is always on in opencode; this level
#                     cannot be meaningfully distinguished from workspace-write.
#   sandboxed       – opencode has no ephemeral sandbox mechanism.

mappings:
  none:
    native_flags:
      - '--dangerously-skip-permissions'
  workspace-write:
    native_flags: []
