# adapter.yaml - AUTHORED manifest for adapters/codex/.
# This file is the source of truth. The codex adapter is hand-authored (it
# predates `pmctl adapter generate`), so nothing here is regenerated:
# generated_files is empty and pmctl must not edit this file.
schema_version: 1
adapter_name: codex
executor: codex
cli_binary: codex
isolation_map_ref: ./isolation-map.yaml
runner_ref: ./dispatch.sh
dispatch_contract: dispatch_handover_v1
# runner_kind classifies the execution topology; dispatch_route /
# write_guard_mode / needs_bash_guard derive from it (scripts/lib/runner-kind.sh).
# codex runs as an independent headless subprocess driven by pmctl dispatch run;
# the PM authors the brief (via pmctl or Write to /tmp/brief-*.md) and passes it
# in — no executor subagent self-writes a brief, so no live PreToolUse write guard
# is needed. Spike CC-385a (2026-06-15) confirmed Model B (pmctl-authored brief +
# independent subprocess) works end-to-end. write_guard_mode overrides cli-subprocess
# default (hook) to cli-only; the bash guard remains (codex dispatches Bash).
runner_kind: cli-subprocess
write_guard_mode: cli-only
# terminal_event: the JSONL event `.type` that marks a semantically complete run.
# `codex exec --json` emits a single `turn.completed` event at the end of a
# finished turn; post-verify asserts at least one trace record matches
# `.type == "turn.completed"` (semantic check, layered on the structural trace
# integrity check). pmctl dispatch run reads this field and threads it to
# dispatch-post-verify.sh as --terminal-event. See docs/executor-contract.md.
terminal_event: turn.completed
generated_files: []
