# adapters/codex/isolation-map.yaml
#
# RUNTIME adapter map — hand-authored, consumed by scripts/codex-dispatch.sh.
# Format: sandbox: + config_overrides: (Codex CLI native fields).
#
# NOTE: This file uses a different schema than starter adapters generated by
# `pmctl adapter generate`, which emit native_flags: (flat CLI-flag map).
# Do NOT replace this file with a pmctl-generated template.
#
# Fields per entry:
#   sandbox          – value for codex exec --sandbox
#   config_overrides – list of -c key=value strings appended to the command
#
# Semantic definitions (source of truth: core/policy/isolation-level.yaml):
#   none             – no isolation; full machine access
#   read-only        – read files only; no writes
#   workspace-write  – write within project working directory only (default)
#   workspace network – workspace-write + TCP localhost access enabled
#   sandboxed        – best-effort; Codex has no true ephemeral mode; maps to
#                     workspace-write with no network (strongest available constraint)

mappings:
  none:
    sandbox: danger-full-access
    config_overrides: []
  read-only:
    sandbox: read-only
    config_overrides: []
  workspace-write:
    sandbox: workspace-write
    config_overrides: []
  workspace-network:
    sandbox: workspace-write
    config_overrides:
      - 'sandbox_workspace_write.network_access=true'
  sandboxed:
    sandbox: workspace-write
    config_overrides: []
