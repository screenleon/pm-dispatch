# core/state/layout.yaml
#
# Machine-readable specification of the pm-dispatch state-store layout.
# Definitions only — does NOT include the writer logic.
#
# Path placeholders:
#   $STORE         := $PM_DISPATCH_STATE_ROOT
#                     resolution order (evaluated by state-writer.sh):
#                       1. $PM_DISPATCH_STATE_ROOT   (explicit override)
#                       2. $XDG_DATA_HOME/pm-dispatch/state  (if XDG_DATA_HOME set)
#                       3. store_root_default below  (fallback)
#   $PROJECT       := sha1(git rev-parse --show-toplevel) — partitioning key
#   $TASK_ID       := pattern ^[A-Z]{1,4}-[0-9]+$ (task.schema.json)
#   $TS_HEX        := YYYYMMDDTHHMMSSZ-<6 hex>   (run/event/review id suffix)
#   $YYYYMM        := archive rotation period (UTC month)
#   $NNNN          := zero-padded monotonic archive segment within $YYYYMM

# Version of the on-disk store layout described by this file. Distinct from
# the per-entity schema_version fields declared in ../schema/*.schema.json —
# entity rows version independently of the directory/file layout.
# Canonical shell definition: runtime/lib/state-compat.sh (SW_STORE_LAYOUT_VERSION).
store_layout_version: 1
store_root_env: PM_DISPATCH_STATE_ROOT
store_root_default: "~/.local/share/pm-dispatch/state"
store_root_xdg_subpath: "pm-dispatch/state"

# Global files (cross-project)
global:
  - path: "$STORE/VERSION"
    format: text
    description: "Plain text, contents match the current store_layout_version (NOT any entity schema_version)."
  - path: "$STORE/store.lock"
    format: lockfile
    description: "Reserved for cross-project ops; serialize_with_lock target for global operations."

# Per-project partition
project_partition:
  root: "$STORE/projects/$PROJECT/"

  files:
    - path: "repo.json"
      schema: null
      description: "{repo_path, repo_name, first_seen_ts} — debug aid + future re-partitioning hook."
      write_strategy: write-temp-then-rename

    - path: "runs.jsonl"
      schema: ../schema/run.schema.json
      description: "Append-only Run rows. One row per executor dispatch."
      write_strategy: append-locked
      lock: runs.lock
      rotation:
        threshold_bytes: 52428800   # 50 MB (overridable via PM_DISPATCH_ROTATE_MAX_BYTES)
        threshold_days: 90          # not yet enforced; rotation triggers on threshold_bytes only
        # $NNNN is a monotonic per-month segment suffix that avoids same-month collisions.
        archive_path: archive/runs-$YYYYMM-$NNNN.jsonl.gz

    - path: "runs.lock"
      format: lockfile
      description: "Per-project, per-entity lock for runs.jsonl. serialize_with_lock target."

    - path: "events.jsonl"
      schema: ../schema/event.schema.json
      description: "Append-only Event rows. State changes, hook firings, decisions."
      write_strategy: append-locked
      lock: events.lock
      rotation:
        threshold_bytes: 52428800   # overridable via PM_DISPATCH_ROTATE_MAX_BYTES
        threshold_days: 90          # not yet enforced; rotation triggers on threshold_bytes only
        # $NNNN is a monotonic per-month segment suffix that avoids same-month collisions.
        archive_path: archive/events-$YYYYMM-$NNNN.jsonl.gz

    - path: "events.lock"
      format: lockfile

    - path: "repo-index.db"
      format: sqlite
      description: "Builtin repo symbol index (files / symbols / file_chunks). Derived cache — rebuildable from source tree; concurrency handled by SQLite WAL, NOT serialize_with_lock."
      rebuildable: true

  subdirs:
    - path: "tasks/"
      file_pattern: "$TASK_ID.json"
      schema: ../schema/task.schema.json
      description: "Latest Task projection per id. One file per task; individually addressable. Write-temp-then-rename for atomicity."
      write_strategy: write-temp-then-rename

    - path: "reviews/"
      file_pattern: "rev-$TS_HEX.json"
      schema: ../schema/review.schema.json
      description: "One file per Review. Sparse, low-volume."
      write_strategy: write-temp-then-rename

    - path: "decisions/"
      file_pattern: "dec-YYYY-MM-DD-<slug>.json"
      schema: ../schema/decision.schema.json
      description: "Mirrors DECISIONS.md index rows."
      write_strategy: write-temp-then-rename

    - path: "operations/"
      file_pattern: "op-$TS_HEX.json"
      schema: ../schema/operation.schema.json
      description: "Parent-operation lifecycle records and append-only child relations."
      write_strategy: write-temp-then-rename

    - path: "context-packs/"
      file_pattern: "$TASK_ID-$TS_HEX.json"
      schema: ../schema/context-pack.schema.json
      description: "ContextPack snapshots. Keep last 5 per task_id."
      write_strategy: write-temp-then-rename
      retention: "keep-last-5-per-task"

    - path: "archive/"
      description: "Rotated JSONL segments from runs.jsonl / events.jsonl. Gzipped."
      file_patterns:
        - "runs-$YYYYMM-$NNNN.jsonl.gz"
        - "events-$YYYYMM-$NNNN.jsonl.gz"

# Writer-boundary contract
writer:
  description: "Single designated write boundary. The runtime layer owns the concrete module binding; only the designated writer module may write to $STORE paths."
  entry_points:
    - runs_append
    - events_append
    - task_upsert
    - task_delete
    - review_upsert
    - decision_upsert
    - decision_delete

# Forbidden writers (enforced across production shell domains by the
# test-layer-boundaries content ratchet)
forbidden:
  - "any path under $STORE/ written without serialize_with_lock — EXCEPT derived caches declared rebuildable:true (e.g. repo-index.db), which use SQLite WAL for concurrency instead"
  - "any path under $STORE/ written by code outside the designated writer module (see writer.description above)"
  - "any hard-coded path; all paths must be resolved through this file"
