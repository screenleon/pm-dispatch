# core/policy/task-states.yaml
#
# Task lifecycle states. Consumed by core/schema/task.schema.json (state
# field, inline enum kept in sync).

states:
  - open
  - claimed
  - in-progress
  - blocked
  - done
  - dropped

# Allowed transitions (informational; documents the state machine for
# human readers and future validator).
transitions:
  open:
    - claimed
    - dropped
  claimed:
    - in-progress
    - open       # un-claim
    - dropped
  in-progress:
    - blocked
    - done
    - dropped
  blocked:
    - in-progress
    - dropped
  done: []        # terminal
  dropped: []     # terminal
